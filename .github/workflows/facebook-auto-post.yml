name: Facebook Page Auto Poster

on:
  schedule:
    # Runs every 12 hours (adjust the cron if you want a different cadence)
    - cron: '0 */12 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the rotation state file

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post next product in rotation to Facebook Page
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python scripts/post_to_facebook.py

      - name: Commit updated rotation state
        run: |
          git config user.name "fb-auto-poster-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/rotation_state.json
          git diff --quiet --cached || git commit -m "chore: advance product rotation"
          git push
